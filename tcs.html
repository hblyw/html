<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 3D · 卡通版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2358c248'/%3E%3Ccircle cx='6' cy='6' r='1.6' fill='%23fff'/%3E%3Ccircle cx='10' cy='6' r='1.6' fill='%23fff'/%3E%3Ccircle cx='6.4' cy='6.2' r='0.8' fill='%23000'/%3E%3Ccircle cx='10.4' cy='6.2' r='0.8' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Fredoka','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(180deg,#ff8fd4 0%,#c79bff 45%,#6fe3ff 100%);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  /* ===== HUD ===== */
  .hud{position:fixed;top:14px;left:14px;display:flex;flex-direction:column;gap:8px;z-index:6;}
  .pill{background:rgba(255,255,255,.88);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;color:#5b4b8a;
    box-shadow:0 6px 16px rgba(80,70,140,.18);display:flex;align-items:center;gap:8px;}
  .pill .dot{width:12px;height:12px;border-radius:50%;}
  .mute{position:fixed;top:14px;right:14px;z-index:8;width:46px;height:46px;border-radius:50%;border:none;
    background:rgba(255,255,255,.88);box-shadow:0 6px 16px rgba(80,70,140,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .mute svg{width:20px;height:20px;}
  /* ===== 卡片覆盖层 ===== */
  .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px;
    background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.35),rgba(120,150,200,.28));}
  .overlay.hidden{display:none;}
  .card{background:#fff;border-radius:34px;padding:34px 30px;text-align:center;width:min(88vw,380px);
    box-shadow:0 24px 60px rgba(70,80,140,.30);}
  .card h1{font-size:34px;line-height:1.1;font-weight:700;
    background:linear-gradient(90deg,#ff3d9a,#ff8a00,#7a5cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .card .sub{margin-top:10px;font-size:15px;color:#8a86b8;font-weight:500;line-height:1.6;}
  .scoreline{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .chip{background:#f1edff;border-radius:16px;padding:10px 16px;font-size:15px;font-weight:600;color:#5b4b8a;}
  .btn{margin-top:24px;font-family:inherit;font-size:19px;font-weight:700;color:#fff;border:none;cursor:pointer;
    border-radius:999px;padding:15px 40px;background:linear-gradient(180deg,#7bd86a,#46b53c);
    box-shadow:0 7px 0 #2f8f28,0 14px 22px rgba(60,150,50,.35);}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #2f8f28;}
  .btn.orange{background:linear-gradient(180deg,#ffb45a,#ff8a2b);box-shadow:0 7px 0 #d9681a,0 14px 22px rgba(220,120,40,.3);}
  .btn.orange:active{box-shadow:0 2px 0 #d9681a;}
  .keys{margin-top:16px;font-size:13px;color:#9a96c4;font-weight:500;line-height:1.9;}
  /* ===== 触屏方向键 ===== */
  .dpad{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:7;display:none;
    grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:8px;}
  .dbtn{border:none;border-radius:22px;background:rgba(255,255,255,.78);box-shadow:0 5px 12px rgba(80,70,140,.18);
    display:flex;align-items:center;justify-content:center;touch-action:none;}
  .dbtn svg{width:26px;height:26px;}
  .dbtn:active{background:#fff;}
  .d-u{grid-area:1/2;}.d-l{grid-area:2/1;}.d-r{grid-area:2/3;}.d-d{grid-area:3/2;}
  @media (pointer:coarse){.dpad{display:grid;}}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:6;font-size:13px;font-weight:500;
    color:#5b6f9a;background:rgba(255,255,255,.7);padding:8px 16px;border-radius:999px;}
  @media (pointer:coarse){.hint{display:none;}}
</style>
</head>
<body>
<div id="app"><canvas id="scene"></canvas></div>

<div class="hud">
  <div class="pill"><span class="dot" style="background:#ff8a2b"></span>分数 <b id="score">0</b></div>
  <div class="pill"><span class="dot" style="background:#a594f9"></span>最高 <b id="best">0</b></div>
</div>

<button class="mute" id="muteBtn" aria-label="声音开关">
  <svg viewBox="0 0 24 24" fill="#5b4b8a"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6" fill="none" stroke="#5b4b8a" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="ovStart">
  <div class="card">
    <h1>贪吃蛇 3D</h1>
    <div class="sub">卡通立体世界，吃掉苹果、越长越长，别撞到墙和自己哦</div>
    <div class="keys">电脑：方向键 / WASD 转向 · 空格开始<br>手机：滑动屏幕 或 点击方向键</div>
    <button class="btn" id="btnStart">开始游戏</button>
  </div>
</div>

<div class="overlay hidden" id="ovOver">
  <div class="card">
    <h1 id="overTitle">游戏结束</h1>
    <div class="scoreline">
      <div class="chip">得分 <b id="overScore">0</b></div>
      <div class="chip">最高 <b id="overBest">0</b></div>
    </div>
    <button class="btn orange" id="btnRestart">再来一局</button>
  </div>
</div>

<div class="dpad" id="dpad">
  <button class="dbtn d-u" data-dir="up"><svg viewBox="0 0 24 24" fill="#5b4b8a"><path d="M12 5l7 9H5z"/></svg></button>
  <button class="dbtn d-l" data-dir="left"><svg viewBox="0 0 24 24" fill="#5b4b8a"><path d="M9 12l9 7V5z"/></svg></button>
  <button class="dbtn d-r" data-dir="right"><svg viewBox="0 0 24 24" fill="#5b4b8a"><path d="M15 12l-9 7V5z"/></svg></button>
  <button class="dbtn d-d" data-dir="down"><svg viewBox="0 0 24 24" fill="#5b4b8a"><path d="M12 19l-7-9h14z"/></svg></button>
</div>

<div class="hint">方向键 / WASD 转向 · 空格开始 / 重开 · P 暂停</div>

<script>
/* ===== Three.js 双源加载（jsDelivr -> cdnjs） ===== */
function loadThree(cb){
  if(window.THREE){cb();return;}
  var primary='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  var backup='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  function add(src,ok,fail){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s);}
  add(primary,cb,function(){add(backup,cb,function(){});});
}

var renderer,scene,camera,toonGradient,clouds;
var N=17,HALF=N/2;
var isCoarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;

function toonMat(color){return new THREE.MeshToonMaterial({color:color,gradientMap:toonGradient});}
function stdMat(color,rough){return new THREE.MeshStandardMaterial({color:color,roughness:rough==null?0.4:rough,metalness:0});}

function initThree(){
  var canvas=document.getElementById('scene');
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,isCoarse?1.6:2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  scene=new THREE.Scene();
  /* 多巴胺竖向渐变天空（屏幕空间背景） */
  var bgcv=document.createElement('canvas');bgcv.width=2;bgcv.height=256;
  var bgg=bgcv.getContext('2d');
  var lg=bgg.createLinearGradient(0,0,0,256);
  lg.addColorStop(0,'#ff8fd4');lg.addColorStop(.45,'#c79bff');lg.addColorStop(1,'#6fe3ff');
  bgg.fillStyle=lg;bgg.fillRect(0,0,2,256);
  scene.background=new THREE.CanvasTexture(bgcv);
  scene.fog=new THREE.Fog('#b9a3f8',40,82);

  camera=new THREE.PerspectiveCamera(42,window.innerWidth/window.innerHeight,0.1,120);
  fitCamera();

  /* Toon 三档渐变 */
  var d=new Uint8Array([85,170,255]);
  var tex=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);
  tex.minFilter=THREE.NearestFilter;tex.magFilter=THREE.NearestFilter;tex.needsUpdate=true;
  toonGradient=tex;

  /* 灯光：半球环境 + 主光投影 + 冷色补光 */
  scene.add(new THREE.HemisphereLight('#fff4fb','#ffe18a',0.78));
  var key=new THREE.DirectionalLight('#ffffff',0.95);
  key.position.set(9,16,8);
  key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);
  var s=key.shadow.camera;
  s.left=-15;s.right=15;s.top=15;s.bottom=-15;s.near=1;s.far=48;
  key.shadow.bias=-0.002;key.shadow.radius=4;
  scene.add(key);
  var fill=new THREE.DirectionalLight('#cfe0ff',0.32);fill.position.set(-10,8,-7);scene.add(fill);

  buildBoard();
  buildClouds();
}

/* ===== 相机按棋盘尺寸自适应（任何宽高比都完整可见） ===== */
function fitCamera(){
  var aspect=window.innerWidth/window.innerHeight;
  camera.aspect=aspect;camera.updateProjectionMatrix();
  var fov=camera.fov*Math.PI/180;
  var size=HALF+1.7;
  var dH=size/Math.tan(fov/2);
  var dW=dH/aspect;
  var dist=Math.max(dH,dW)*1.05;
  var v=new THREE.Vector3(0,0.82,0.6).normalize();
  camera.position.set(v.x*dist,v.y*dist,v.z*dist);
  camera.lookAt(0,0,0);
}

/* ===== 圆角挤出棋盘 ===== */
function roundedRectShape(w,h,r){
  var x=-w/2,y=-h/2,s=new THREE.Shape();
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function buildBoard(){
  var shape=roundedRectShape(N+1.7,N+1.7,1.15);
  var geo=new THREE.ExtrudeGeometry(shape,
    {depth:0.9,bevelEnabled:true,bevelThickness:0.3,bevelSize:0.3,bevelSegments:5,steps:1});
  geo.rotateX(-Math.PI/2);
  geo.translate(0,-1.2,0);
  var rim=new THREE.Mesh(geo,toonMat('#ff3d9a'));
  rim.receiveShadow=true;rim.castShadow=true;
  scene.add(rim);

  /* 薄荷格子面（Canvas 棋盘纹理，Lambert 可接收阴影） */
  var cv=document.createElement('canvas');cv.width=cv.height=256;
  var g=cv.getContext('2d'),cs=256/N;
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    g.fillStyle=(x+y)%2?'#ffe066':'#ff9ad5';
    g.fillRect(x*cs,y*cs,cs+1,cs+1);
  }
  var t=new THREE.CanvasTexture(cv);
  var plane=new THREE.Mesh(new THREE.PlaneGeometry(N,N),
    new THREE.MeshLambertMaterial({map:t}));
  plane.rotation.x=-Math.PI/2;plane.position.y=0.04;plane.receiveShadow=true;
  scene.add(plane);
}

/* ===== 卡通云朵 ===== */
function makeCloud(x,y,z,scale,color){
  var grp=new THREE.Group();
  var mat=toonMat(color||'#ffffff');
  var specs=[[0,0,0,1],[1.1,0.1,0.2,0.8],[-1.1,0,0.1,0.75],[0.4,0.4,-0.1,0.7],[-0.5,0.32,-0.1,0.62]];
  specs.forEach(function(sp){
    var m=new THREE.Mesh(new THREE.SphereGeometry(sp[3],14,12),mat);
    m.position.set(sp[0],sp[1],sp[2]);grp.add(m);
  });
  grp.position.set(x,y,z);grp.scale.setScalar(scale);
  grp.userData.speed=0.25+Math.random()*0.25;
  scene.add(grp);return grp;
}
function buildClouds(){
  clouds=[];
  /* 云朵全部放在棋盘后方远空（z 负向），不会飘过遮挡操作区 */
  [[-20,12,-24,1.1,'#ffffff'],[12,13,-26,0.95,'#fff3c0'],[0,14,-28,1.2,'#e8fbff'],
   [22,11,-22,0.85,'#ffffff'],[-8,15,-30,1,'#ffe6f4'],[18,14.5,-29,1,'#ffffff']]
    .forEach(function(sp){clouds.push(makeCloud(sp[0],sp[1],sp[2],sp[3],sp[4]));});
}

/* ============================================================
   坐标 / 蛇 / 食物 / 粒子
   ============================================================ */
function cellWorld(i,j){return {x:i-HALF+0.5,z:j-HALF+0.5};}
var SNAKE_GREEN='#4fc23c',SNAKE_BELLY='#b9f08d';
var headGroup,bodyPool=[],tongue;
var food,particlePool=[];

/* ===== 蛇头（大眼睛，面部朝 +z） ===== */
function createHead(){
  headGroup=new THREE.Group();
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.48,26,22),stdMat(SNAKE_GREEN,0.38));
  head.scale.set(1.05,0.92,1.05);head.castShadow=true;head.frustumCulled=false;
  headGroup.add(head);
  /* 浅色下巴/肚皮，圆润更逼真 */
  var chin=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),stdMat(SNAKE_BELLY,0.5));
  chin.scale.set(1,0.5,0.85);chin.position.set(0,-0.3,0.05);chin.frustumCulled=false;
  headGroup.add(chin);
  var eyeMat=new THREE.MeshBasicMaterial({color:'#fff'});
  var pupMat=new THREE.MeshBasicMaterial({color:'#1c2430'});
  [-0.2,0.2].forEach(function(ex){
    var eye=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10),eyeMat);
    eye.position.set(ex,0.27,0.34);headGroup.add(eye);
    var pup=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),pupMat);
    pup.position.set(ex,0.26,0.45);headGroup.add(pup);
  });
  [-0.12,0.12].forEach(function(nx){
    var n=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,6),pupMat);
    n.position.set(nx,0.1,0.45);headGroup.add(n);
  });
  tongue=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.03,0.3),
    new THREE.MeshBasicMaterial({color:'#ff5a6a'}));
  tongue.position.set(0,-0.08,0.58);tongue.visible=false;
  headGroup.add(tongue);
  scene.add(headGroup);
}
/* ===== 蛇身（按需创建池） ===== */
function ensureBody(n){
  while(bodyPool.length<n){
    var g=new THREE.Group();
    var s=new THREE.Mesh(new THREE.SphereGeometry(0.4,20,18),stdMat(SNAKE_GREEN,0.38));
    s.castShadow=true;s.receiveShadow=true;s.frustumCulled=false;g.add(s);
    /* 肚皮：下方浅色压扁椭球 */
    var b=new THREE.Mesh(new THREE.SphereGeometry(0.36,16,12),stdMat(SNAKE_BELLY,0.5));
    b.scale.set(1,0.4,0.9);b.position.y=-0.2;b.frustumCulled=false;g.add(b);
    g.visible=false;scene.add(g);bodyPool.push(g);
  }
}

/* ===== 苹果食物 ===== */
function makeFood(i,j){
  var grp=new THREE.Group();
  /* 苹果轮廓（含顶部凹窝）经 Lathe 旋转成型 */
  var profile=[[0,-0.45],[0.1,-0.43],[0.28,-0.38],[0.38,-0.25],[0.42,-0.05],
    [0.42,0.12],[0.38,0.26],[0.3,0.36],[0.18,0.42],[0.08,0.43],[0.05,0.4],[0,0.4]]
    .map(function(p){return new THREE.Vector2(p[0],p[1]);});
  var apple=new THREE.Mesh(new THREE.LatheGeometry(profile,28),stdMat('#ff4d4d',0.22));
  apple.castShadow=true;apple.scale.set(1,1.02,0.96);grp.add(apple);
  var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.22,8),stdMat('#7a4a22',0.6));
  stem.position.set(0.03,0.53,0);stem.rotation.z=0.25;stem.castShadow=true;grp.add(stem);
  var leaf=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,8),stdMat('#3fae3a',0.4));
  leaf.scale.set(1.6,0.35,0.9);leaf.position.set(0.16,0.5,0.02);leaf.castShadow=true;grp.add(leaf);
  /* 表皮高光点 */
  var shine=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),
    new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0.55}));
  shine.position.set(-0.16,0.14,0.32);grp.add(shine);
  var w=cellWorld(i,j);grp.position.set(w.x,0.42,w.z);
  grp.userData={i:i,j:j,t:Math.random()*6};
  scene.add(grp);return grp;
}
var BURST_COLORS=['#ff8a2b','#ffd23b','#ff5a8a','#5ab8ff','#a594f9','#58c248'];
function getParticle(color){
  for(var k=0;k<particlePool.length;k++)if(!particlePool[k].visible)return particlePool[k];
  var m=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8),new THREE.MeshBasicMaterial({color:color}));
  m.visible=false;scene.add(m);particlePool.push(m);return m;
}
function burst(wx,wz){
  for(var k=0;k<12;k++){
    var m=getParticle(BURST_COLORS[k%BURST_COLORS.length]);
    m.material.color.set(BURST_COLORS[k%BURST_COLORS.length]);
    var a=Math.random()*Math.PI*2,r=0.8+Math.random()*1.6;
    m.userData.vx=Math.cos(a)*r;
    m.userData.vz=Math.sin(a)*r;
    m.userData.vy=2+Math.random()*2.2;
    m.userData.life=0.7+Math.random()*0.3;m.userData.age=0;
    m.position.set(wx,0.45,wz);m.scale.setScalar(1);m.visible=true;
  }
}
function updateParticles(dt){
  particlePool.forEach(function(m){
    if(!m.visible)return;
    m.userData.age+=dt;
    m.userData.vy-=6.5*dt;
    m.position.x+=m.userData.vx*dt;
    m.position.y+=m.userData.vy*dt;
    m.position.z+=m.userData.vz*dt;
    if(m.position.y<0.09){m.position.y=0.09;m.userData.vy*=-0.4;}
    var p=1-m.userData.age/m.userData.life;
    m.scale.setScalar(Math.max(p,0.01));
    if(m.userData.age>=m.userData.life)m.visible=false;
  });
}

/* ============================================================
   游戏逻辑
   ============================================================ */
var game={mode:'start'};
var snake,prevSnake,dir,dirQueue,score,best=0;
var acc=0,tickMs,shake=0,headPunch=0,gameOverAge=0,paused=false;
try{best=parseInt(localStorage.getItem('snake3d_best')||'0',10)||0;}catch(e){}

function resetGame(){
  var c=Math.floor(N/2);
  snake=[{x:c,y:c},{x:c-1,y:c},{x:c-2,y:c}];
  prevSnake=snake.map(function(s){return {x:s.x,y:s.y};});
  dir={x:1,y:0};dirQueue=[];
  score=0;tickMs=190;acc=0;shake=0;headPunch=0;gameOverAge=0;paused=false;
  ensureBody(snake.length-1);
  if(food){scene.remove(food);food=null;}
  spawnFood();
  renderSnake(1);
  updateScoreUI();
}
function occupied(i,j){return snake.some(function(s){return s.x===i&&s.y===j;});}
function spawnFood(){
  var free=[];
  for(var i=0;i<N;i++)for(var j=0;j<N;j++)if(!occupied(i,j))free.push({x:i,y:j});
  var pick=free[Math.floor(Math.random()*free.length)];
  food=makeFood(pick.x,pick.y);
}
function queueTurn(nx,ny){
  var ref=dirQueue.length?dirQueue[dirQueue.length-1]:dir;
  if(nx===-ref.x&&ny===-ref.y)return;
  if(nx===ref.x&&ny===ref.y)return;
  if(dirQueue.length<2)dirQueue.push({x:nx,y:ny});
}
function logicTick(){
  prevSnake=snake.map(function(s){return {x:s.x,y:s.y};});
  if(dirQueue.length)dir=dirQueue.shift();
  var h=snake[0],nh={x:h.x+dir.x,y:h.y+dir.y};
  if(nh.x<0||nh.y<0||nh.x>=N||nh.y>=N){endGame();return;}
  var eating=food&&nh.x===food.userData.i&&nh.y===food.userData.j;
  var body=eating?snake:snake.slice(0,snake.length-1);
  for(var k=0;k<body.length;k++)
    if(body[k].x===nh.x&&body[k].y===nh.y){endGame();return;}
  snake.unshift(nh);
  if(eating){
    score+=10;headPunch=1;
    var w=cellWorld(food.userData.i,food.userData.j);
    burst(w.x,w.z);sfxEat();
    scene.remove(food);food=null;spawnFood();
    ensureBody(snake.length-1);
    tickMs=Math.max(85,190-(snake.length-3)*9);
    updateScoreUI();
  }else snake.pop();
}
function endGame(){
  game.mode='over';gameOverAge=0;shake=0.55;sfxDie();
  if(score>best){best=score;try{localStorage.setItem('snake3d_best',String(best));}catch(e){}}
  document.getElementById('overScore').textContent=score;
  document.getElementById('overBest').textContent=best;
  document.getElementById('best').textContent=best;
}
function startGame(){
  resetGame();
  game.mode='play';
  document.getElementById('ovStart').classList.add('hidden');
  document.getElementById('ovOver').classList.add('hidden');
  sfxStart();
}

/* ===== 逐帧插值渲染蛇 ===== */
function renderSnake(p){
  var h0=prevSnake[0],h1=snake[0];
  var a=cellWorld(h0.x,h0.y),b=cellWorld(h1.x,h1.y);
  var hop=Math.sin(p*Math.PI)*0.13;
  headGroup.position.set(a.x+(b.x-a.x)*p,0.42+hop,a.z+(b.z-a.z)*p);
  headGroup.rotation.y=Math.atan2(dir.x,dir.y);
  headGroup.scale.setScalar(1+headPunch*0.28);
  for(var k=1;k<snake.length;k++){
    var s0=prevSnake[k]||prevSnake[prevSnake.length-1];
    var s1=snake[k];
    var c0=cellWorld(s0.x,s0.y),c1=cellWorld(s1.x,s1.y);
    var m=bodyPool[k-1];m.visible=true;
    var sq=Math.sin(p*Math.PI);
    var tail=(k===snake.length-1)?0.72:1;
    m.position.set(c0.x+(c1.x-c0.x)*p,0.4+sq*0.05,c0.z+(c1.z-c0.z)*p);
    m.scale.set((1+0.07*sq)*tail,(1-0.1*sq)*tail,(1+0.07*sq)*tail);
  }
  for(;k<bodyPool.length;k++)bodyPool[k].visible=false;
}

/* ============================================================
   输入：键盘 / 滑动 / 方向键
   ============================================================ */
var DIRMAP={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
var KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',function(e){
  var d=KEYS[e.code];
  if(d){
    if(game.mode==='play'){queueTurn(DIRMAP[d][0],DIRMAP[d][1]);}
    e.preventDefault();
  }
  if(e.code==='Space'||e.code==='Enter'){
    if(game.mode==='start'||game.mode==='over')startGame();
    e.preventDefault();
  }
  if(e.code==='KeyP'&&(game.mode==='play'||game.mode==='pause')){
    game.mode=(game.mode==='play')?'pause':'play';paused=game.mode==='pause';
    e.preventDefault();
  }
  if(e.code==='KeyM'){toggleMute();}
});
/* 触屏滑动 */
var tx0=0,ty0=0,touching=false;
var cv=document.getElementById('scene');
cv.addEventListener('touchstart',function(e){
  touching=true;tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;
},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(!touching)return;
  var x=e.touches[0].clientX,y=e.touches[0].clientY;
  var dx=x-tx0,dy=y-ty0;
  if(Math.abs(dx)<26&&Math.abs(dy)<26)return;
  var d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  if(game.mode==='play')queueTurn(DIRMAP[d][0],DIRMAP[d][1]);
  tx0=x;ty0=y;
  e.preventDefault();
},{passive:false});
/* 屏幕方向键 */
document.querySelectorAll('.dbtn').forEach(function(b){
  b.addEventListener('pointerdown',function(e){
    var d=b.getAttribute('data-dir');
    if(game.mode==='play')queueTurn(DIRMAP[d][0],DIRMAP[d][1]);
    e.preventDefault();
  });
});
document.getElementById('btnStart').addEventListener('click',startGame);
document.getElementById('btnRestart').addEventListener('click',startGame);
document.getElementById('muteBtn').addEventListener('click',toggleMute);

/* ============================================================
   HUD / 音效 / 主循环 / 启动
   ============================================================ */
function updateScoreUI(){
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=Math.max(best,score);
}
/* ---- 软音色 WebAudio ---- */
var actx=null,muted=false;
try{muted=localStorage.getItem('snake3d_mute')==='1';}catch(e){}
function ensureAudio(){
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
}
function tone(freq,dur,type,when,vol){
  if(muted)return;ensureAudio();
  var t=actx.currentTime+(when||0);
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.24,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.03);
}
function sfxEat(){tone(540,0.09,'triangle',0,0.27);tone(830,0.13,'triangle',0.08,0.25);}
function sfxStart(){[523,659,784].forEach(function(f,i){tone(f,0.12,'triangle',i*0.09,0.24);});}
function sfxDie(){
  if(muted)return;ensureAudio();
  var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(420,t);
  o.frequency.exponentialRampToValueAtTime(110,t+0.5);
  g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.6);
}
function toggleMute(){
  muted=!muted;
  try{localStorage.setItem('snake3d_mute',muted?'1':'0');}catch(e){}
  updateMuteIcon();
}
function updateMuteIcon(){
  var b=document.getElementById('muteBtn');
  b.innerHTML=muted
    ? "<svg viewBox='0 0 24 24' fill='#5b4b8a'><path d='M4 9v6h4l5 4V5L8 9H4z'/><path d='M16 9l5 6M21 9l-5 6' stroke='#5b4b8a' stroke-width='2' stroke-linecap='round'/></svg>"
    : "<svg viewBox='0 0 24 24' fill='#5b4b8a'><path d='M4 9v6h4l5 4V5L8 9H4z'/><path d='M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11' fill='none' stroke='#5b4b8a' stroke-width='2' stroke-linecap='round'/></svg>";
}

/* ---- 主循环 ---- */
var basePos;
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-last)/1000,0.05);last=now;

  if(game.mode==='play'){
    acc+=dt*1000;
    var guard=0;
    while(acc>=tickMs&&guard<4){
      logicTick();acc-=tickMs;guard++;
      if(game.mode!=='play'){acc=0;break;}
    }
  }
  var p=(game.mode==='play')?Math.min(acc/tickMs,1):1;
  if(snake)renderSnake(p);

  if(food){
    food.userData.t+=dt;
    food.position.y=0.4+Math.sin(food.userData.t*3)*0.07;
    food.rotation.y+=dt*0.8;
  }
  updateParticles(dt);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce)clouds.forEach(function(c){
    c.position.x+=c.userData.speed*dt;
    if(c.position.x>30)c.position.x=-30;
  });
  headPunch=Math.max(0,headPunch-dt*4);

  if(game.mode==='over'){
    gameOverAge+=dt;
    if(gameOverAge>0.5)document.getElementById('ovOver').classList.remove('hidden');
  }

  /* 相机震动（受控强调层） */
  camera.position.copy(basePos);
  if(shake>0){
    shake=Math.max(0,shake-dt*1.5);
    camera.position.x+=(Math.random()-0.5)*shake*0.6;
    camera.position.y+=(Math.random()-0.5)*shake*0.5;
    camera.lookAt(0,0,0);
  }else camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}
window.addEventListener('resize',function(){
  if(!renderer)return;
  renderer.setSize(window.innerWidth,window.innerHeight);
  fitCamera();basePos.copy(camera.position);
});

/* ---- 启动（首帧立即渲染，不懒加载） ---- */
loadThree(function(){
  initThree();
  basePos=new THREE.Vector3();
  basePos.copy(camera.position);
  createHead();
  resetGame();
  document.getElementById('best').textContent=best;
  updateMuteIcon();
  last=performance.now();
  requestAnimationFrame(frame);
});
</script>
